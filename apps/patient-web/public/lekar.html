<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1f3f6e">
  <meta name="robots" content="noindex">
  <title>PillGaze · Lékař</title>
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/lekar.css">
  <script type="module" src="/lekar.js"></script>
</head>
<body class="doctor">
  <a class="skip-link" href="#main">Přejít k obsahu</a>
  <div class="doc-shell">
    <header>
      <a class="brand" href="/lekar"><img src="/icons/icon.svg" width="36" height="36" alt="">PillGaze</a>
    </header>
    <p class="notice" id="storage-notice" role="alert" hidden></p>
    <div class="doc-layout">
      <aside class="doc-side" aria-label="Zadání PINu a historie">
        <form id="pin-form" novalidate>
          <label for="pin">PIN pacienta</label>
          <div class="pin-row">
            <input id="pin" name="pin" maxlength="7" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABC234" aria-describedby="pin-error" autofocus>
            <button type="submit" class="primary" id="pin-submit">Zobrazit</button>
          </div>
          <p id="pin-error" class="field-error" role="alert"></p>
        </form>
        <section aria-labelledby="history-title">
          <h2 id="history-title">Historie</h2>
          <div id="history"></div>
        </section>
      </aside>
      <main id="main" class="doc-main"></main>
    </div>
  </div>

  <dialog id="item-dialog" aria-labelledby="item-dialog-title">
    <form id="item-form" novalidate>
      <h2 id="item-dialog-title">Léčivo</h2>
      <label>Název léčiva<input name="name" maxlength="120" required autocomplete="off"><small class="field-error" data-error="name"></small></label>
      <div class="form-pair">
        <label>Síla / dávkování<input name="dosage" maxlength="120" required autocomplete="off" placeholder="Např. 500 mg"><small class="field-error" data-error="dosage"></small></label>
        <label>Dávek v balení<input name="dosesPerPackage" maxlength="6" inputmode="numeric" required autocomplete="off" placeholder="Např. 30"><small class="field-error" data-error="dosesPerPackage"></small></label>
      </div>
      <div class="form-pair">
        <label><span>Kdy užívat <span class="optional">volitelné</span></span><input name="schedule" maxlength="20" autocomplete="off" placeholder="1-0-0 nebo 4x"><small class="field-error" data-error="schedule"></small></label>
        <label><span>Kód SÚKL <span class="optional">volitelné</span></span><input name="suklCode" maxlength="7" inputmode="numeric" autocomplete="off" placeholder="7 číslic"><small class="field-error" data-error="suklCode"></small></label>
      </div>
      <div class="dialog-actions">
        <button type="button" class="text-button danger" id="item-delete" hidden>Odstranit</button>
        <span class="spacer"></span>
        <button type="button" class="secondary" id="item-cancel">Zrušit</button>
        <button type="submit" class="primary">Uložit</button>
      </div>
    </form>
  </dialog>

  <dialog id="regimen-dialog" aria-labelledby="regimen-dialog-title">
    <form id="regimen-form" novalidate>
      <h2 id="regimen-dialog-title">Režim onkologické léčby</h2>
      <label for="regimen-input" class="sr-only">Název režimu</label>
      <div class="combo-block">
        <input id="regimen-input" maxlength="200" autocomplete="off" placeholder="Začněte psát název režimu (nechte prázdné pro odebrání)">
        <ul id="regimen-suggestions" aria-label="Návrhy režimů" hidden></ul>
      </div>
      <div class="dialog-actions">
        <span class="spacer"></span>
        <button type="button" class="secondary" id="regimen-cancel">Zrušit</button>
        <button type="submit" class="primary">Uložit</button>
      </div>
    </form>
  </dialog>
</body>
</html>
