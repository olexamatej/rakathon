name: Pillgaze application CI

on:
  push:
    branches: [main, pillgaze]
  pull_request:
    branches: [main, master, pillgaze]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CI: "true"
  NODE_OPTIONS: --max-old-space-size=1024
  npm_config_cache: .cache/npm
  npm_config_fetch_retries: "0"
  npm_config_fetch_timeout: "60000"

jobs:
  rust-transfer-api:
    name: Rust transfer API compile
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "1"
    steps:
      - name: Check out backend source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /services/transfer-api/
      - name: Prepare executable temporary directory for Rustup
        run: mkdir -p "$RUNNER_TEMP/rust-tmp"
      - name: Set up Rust stable
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        env:
          TMPDIR: ${{ runner.temp }}/rust-tmp
        with:
          cache-workspaces: services/transfer-api -> services/transfer-api/target
      - name: Test all Rust targets with locked dependencies
        run: cargo test --locked --manifest-path services/transfer-api/Cargo.toml --all-targets

  application:
    name: Web application tests
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out application without reference inputs
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/assets/
            !/knowledge-base/
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Test storage admin client
        run: node --test apps/storage-admin/tests/*.test.mjs
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run unit tests and public-catalog integrity checks
        run: npm test
