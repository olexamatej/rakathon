name: Pillgaze application CI

on:
  push:
    branches: [master, pillgaze]
  pull_request:
    branches: [master, pillgaze]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CI: "true"
  EXPO_NO_TELEMETRY: "1"
  NODE_OPTIONS: --max-old-space-size=1024
  npm_config_cache: .cache/npm
  npm_config_fetch_retries: "0"
  npm_config_fetch_timeout: "60000"

jobs:
  application:
    name: TypeScript, tests and Expo web export
    # Never execute fork PRs on the persistent self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, ARM64, hetzner-sandbox]
    timeout-minutes: 15
    steps:
      - name: Check out application without reference inputs
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/assets/
            !/knowledge-base/
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Report dependency vulnerabilities (non-blocking)
        id: audit
        # Expo tooling has known upstream findings; do not downgrade it with audit fix.
        continue-on-error: true
        run: npm audit --audit-level=high
      - name: Make dependency audit debt visible
        if: steps.audit.outcome == 'failure'
        run: |
          echo '::warning::Dependency audit did not pass. Review the preceding audit output for vulnerabilities or service errors; this check is intentionally non-blocking, not a security approval.'
          printf '%s\n' \
            '### Dependency audit needs review' \
            'The non-blocking npm audit did not pass. See its output for findings or service errors. A green build is not a clean security audit; do not use npm audit fix --force.' \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Check TypeScript
        run: npm run typecheck
      - name: Run unit tests
        run: npm test
      - name: Export Expo web bundle
        # Keep Metro within the single-CPU sandbox; this is a build, not a deployment.
        run: npm run export:web -- --max-workers 1
