name: Pillgaze repository checks

on:
  push:
    branches: [main, master, pillgaze]
  pull_request:
    branches: [main, master, pillgaze]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  repository:
    name: Repository hygiene and workflow validation
    # Only collaborators' PRs may run on the persistent self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, ARM64, hetzner-sandbox]
    timeout-minutes: 5
    steps:
      - name: Check out repository configuration
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/
            /.gitignore
            /.gitattributes
            /.editorconfig
            /opencode.json
            /CONTRIBUTING.md
      - name: Reject versioned local files and credentials
        run: |
          set -euo pipefail
          git ls-files --cached --ignored --exclude-standard -z > "$RUNNER_TEMP/ignored-tracked-files"
          if test -s "$RUNNER_TEMP/ignored-tracked-files"; then
            echo 'Files covered by .gitignore are tracked; review with git ls-files --cached --ignored --exclude-standard.' >&2
            exit 1
          fi
      - name: Check configuration whitespace
        run: |
          set -euo pipefail
          empty_tree=$(git hash-object -t tree /dev/null)
          git diff --check "$empty_tree" HEAD -- \
            .github .gitignore .gitattributes .editorconfig opencode.json CONTRIBUTING.md
      - name: Validate agent configuration JSON
        run: python3 -m json.tool opencode.json > /dev/null
      - name: Validate GitHub Actions workflows
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --connect-timeout 5 --max-time 60 \
            --output "$RUNNER_TEMP/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_arm64.tar.gz
          printf '325e971b6ba9bfa504672e29be93c24981eeb1c07576d730e9f7c8805afff0c6  %s\n' \
            "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -config-file .github/actionlint.yaml -shellcheck= -pyflakes= .github/workflows/*.yml
