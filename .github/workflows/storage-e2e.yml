name: Patient storage E2E

on:
  push:
    branches: [main, pillgaze]
  pull_request:
    branches: [main, pillgaze]
  workflow_dispatch:
    inputs:
      live:
        description: 'Test deployed rakathon.denishromada.com (creates one synthetic record)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: storage-e2e-${{ inputs.live && 'production' || github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  storage:
    name: Patient upload and authenticated storage admin
    # A fresh hosted VM has browsers and can reach the public deployment without
    # weakening the Hetzner runner's network isolation. Live secrets only on main.
    if: ${{ !inputs.live || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: e2e
        shell: bash
    env:
      CI: 'true'
    steps:
      - name: Check out test and application sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /e2e/
            /apps/patient-web/
            /apps/storage-admin/
            /services/transfer-api/
            /data/regimens.json
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Set up Rust stable
        if: ${{ !inputs.live }}
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          cache-workspaces: services/transfer-api -> services/transfer-api/target
      - name: Build real storage backend
        if: ${{ !inputs.live }}
        env:
          CARGO_BUILD_JOBS: '2'
        run: cargo build --locked --manifest-path ../services/transfer-api/Cargo.toml
      - name: Install locked browser test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium and system dependencies
        run: npx --no-install playwright install --with-deps --only-shell chromium
      - name: Test patient to storage admin flow
        env:
          E2E_BASE_URL: ${{ inputs.live && 'https://rakathon.denishromada.com' || '' }}
          STORAGE_ADMIN_PASSWORD: ${{ inputs.live && secrets.STORAGE_ADMIN_PASSWORD || '' }}
        run: npm test
