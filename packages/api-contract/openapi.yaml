openapi: 3.1.0
info:
  title: PillGaze Blob Storage API
  version: 0.4.0
  description: >-
    Store opaque JSON and retrieve its exact bytes using a four-digit PIN.
    No expiry, consumption, revocation, or encryption enforcement. Synthetic data only.
    Optional password-protected admin lists metadata and deletes selected or all blobs.
    Responses use Cache-Control: no-store. POC storage reads log the requested PIN,
    UTC timestamp, placeholder user poc-user, source IP and result status.
    Never log payloads or admin credentials.
paths:
  /v1/transfers:
    post:
      operationId: createTransfer
      summary: Store an opaque JSON blob
      description: >-
        Every successful POST creates a separate stored blob with a distinct PIN,
        even for byte-identical payloads. No content deduplication or idempotency;
        repeated submissions are independent copies. At most 10000 four-digit PINs can
        be occupied; exhausted capacity returns 503 without overwriting any blob.
      requestBody:
        required: true
        content:
          application/json:
            schema: {}
      responses:
        '201':
          description: Stored; the response contains only the PIN.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [pin]
                properties:
                  pin:
                    $ref: '#/components/schemas/Pin'
        '400':
          description: Invalid JSON or missing application/json content type.
        '413':
          description: Request exceeds 1048576 bytes (1 MiB).
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/transfers/{pin}:
    put:
      operationId: updateTransfer
      summary: Replace an existing blob under the same PIN
      description: >-
        Possession of the PIN permits replacing its exact JSON bytes. Does not
        create a blob when the PIN is missing. Last successful write wins.
        Shares the POST source limit of 30 writes per minute. No automatic retries.
      parameters:
        - name: pin
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Pin'
      requestBody:
        required: true
        content:
          application/json:
            schema: {}
      responses:
        '200':
          description: Replaced; returns the same PIN.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [pin]
                properties:
                  pin:
                    $ref: '#/components/schemas/Pin'
        '400':
          description: Invalid JSON or missing application/json content type.
        '404':
          description: Unknown or invalid PIN; nothing created.
        '413':
          description: Request exceeds 1048576 bytes (1 MiB).
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
    get:
      operationId: getTransfer
      summary: Retrieve the original JSON blob without modifying or consuming it
      parameters:
        - name: pin
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Pin'
      responses:
        '200':
          description: Exact original request bytes, with application/json content type.
          headers:
            X-Uploaded-At:
              description: UTC time of the most recent successful POST or PUT, recorded by storage.
              schema:
                type: string
                format: date-time
          content:
            application/json:
              schema: {}
        '404':
          description: Unknown or invalid PIN.
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/admin/blobs:
    delete:
      operationId: deleteAllAdminBlobs
      summary: Hard delete every opaque JSON blob across all pages
      description: >-
        Requires the admin password and shares the admin rate limit. A single
        database statement removes all current blobs, invalidating their PINs.
        Does not delete legacy encrypted transfers, schema, credentials or backups.
        Deleting an empty storage succeeds. Concurrent later uploads remain possible.
      security:
        - StorageAdminPassword: []
      responses:
        '204':
          description: All current blobs deleted; no response body.
        '401':
          description: Missing or invalid admin password.
        '404':
          description: Admin endpoints disabled.
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
    get:
      operationId: listAdminBlobs
      summary: List opaque JSON storage metadata with optional debug content
      description: >-
        Enabled only when STORAGE_ADMIN_PASSWORD is configured. Requires its
        value as a Bearer credential over HTTPS. Original PINs and payloads are
        returned only with includeSensitive=true and STORAGE_ADMIN_DEBUG_VISIBILITY=true.
        Older rows may have no stored PIN. Admin calls share a 60/minute socket-IP rate limit.
      security:
        - StorageAdminPassword: []
      parameters:
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 4294967295
            default: 0
        - name: includeSensitive
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: At most 100 rows, newest first.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, hasMore, sensitiveEnabled]
                properties:
                  items:
                    type: array
                    maxItems: 100
                    items:
                      type: object
                      additionalProperties: false
                      required: [pinDigest, sizeBytes]
                      properties:
                        pinDigest:
                          type: string
                          pattern: '^[0-9A-F]{64}$'
                        sizeBytes:
                          type: integer
                          minimum: 0
                          description: Exact JSON payload byte count, not database disk usage.
                        pin:
                          type: string
                          description: Stored debug PIN, including historical six-character codes.
                        payload:
                          type: string
                          description: Exact stored JSON text, available only in debug mode.
                  hasMore:
                    type: boolean
                  sensitiveEnabled:
                    type: boolean
                    description: Whether the server permits sensitive debug visibility.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Missing or invalid admin password.
        '404':
          description: Admin endpoints disabled.
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/admin/blobs/{pinDigest}:
    delete:
      operationId: deleteAdminBlob
      summary: Hard delete one opaque JSON blob
      description: >-
        Deletes only the selected blob, not legacy encrypted transfers or backup
        copies. The HMAC digest is an identifier, not an authorization credential.
      security:
        - StorageAdminPassword: []
      parameters:
        - name: pinDigest
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9A-Fa-f]{64}$'
      responses:
        '204':
          description: Blob deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Missing or invalid admin password.
        '404':
          description: Blob not found or admin endpoints disabled.
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /health/live:
    get:
      operationId: liveness
      responses:
        '200':
          description: Process is running.
  /health/ready:
    get:
      operationId: readiness
      responses:
        '200':
          description: Database is reachable.
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  securitySchemes:
    StorageAdminPassword:
      type: http
      scheme: bearer
      description: Privately configured admin password. Not a revocation token; never log it.
  schemas:
    Pin:
      type: string
      description: >-
        Exactly four ASCII digits (0000–9999), always a string. Preserve leading zeros.
        Previous six-character PINs are no longer accepted by GET or PUT.
      pattern: '^[0-9]{4}$'
      minLength: 4
      maxLength: 4
      example: '0042'
  responses:
    BadRequest:
      description: Request is invalid.
    RateLimited:
      description: Source rate limit exceeded; respect Retry-After.
      headers:
        Retry-After:
          schema:
            type: integer
            example: 60
    Unavailable:
      description: Storage is temporarily unavailable.
