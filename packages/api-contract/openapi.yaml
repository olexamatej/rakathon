openapi: 3.1.0
info:
  title: PillGaze Blob Storage API
  version: 0.2.0
  description: >-
    Store opaque JSON and retrieve its exact bytes using a six-character PIN.
    No expiry, consumption, revocation, or encryption enforcement. Synthetic data only.
    Optional password-protected admin lists metadata and deletes selected blobs.
    Responses use Cache-Control: no-store. Never log payloads, PINs or admin credentials.
paths:
  /v1/transfers:
    post:
      operationId: createTransfer
      summary: Store an opaque JSON blob
      requestBody:
        required: true
        content:
          application/json:
            schema: {}
      responses:
        '201':
          description: Stored; the response contains only the PIN.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [pin]
                properties:
                  pin:
                    $ref: '#/components/schemas/Pin'
        '400':
          description: Invalid JSON or missing application/json content type.
        '413':
          description: Request exceeds 1048576 bytes (1 MiB).
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/transfers/{pin}:
    get:
      operationId: getTransfer
      summary: Retrieve the original JSON blob without modifying or consuming it
      parameters:
        - name: pin
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Pin'
      responses:
        '200':
          description: Exact original request bytes, with application/json content type.
          content:
            application/json:
              schema: {}
        '404':
          description: Unknown or invalid PIN.
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/admin/blobs:
    get:
      operationId: listAdminBlobs
      summary: List opaque JSON storage metadata only
      description: >-
        Enabled only when STORAGE_ADMIN_PASSWORD is configured. Requires its
        value as a Bearer credential over HTTPS. No original PINs or payloads
        are returned. Admin calls share a 60/minute socket-IP rate limit.
      security:
        - StorageAdminPassword: []
      parameters:
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 4294967295
            default: 0
      responses:
        '200':
          description: At most 100 metadata rows, ordered by digest.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, hasMore]
                properties:
                  items:
                    type: array
                    maxItems: 100
                    items:
                      type: object
                      additionalProperties: false
                      required: [pinDigest, sizeBytes]
                      properties:
                        pinDigest:
                          type: string
                          pattern: '^[0-9A-F]{64}$'
                        sizeBytes:
                          type: integer
                          minimum: 0
                          description: Exact JSON payload byte count, not database disk usage.
                  hasMore:
                    type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Missing or invalid admin password.
        '404':
          description: Admin endpoints disabled.
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/admin/blobs/{pinDigest}:
    delete:
      operationId: deleteAdminBlob
      summary: Hard delete one opaque JSON blob
      description: >-
        Deletes only the selected blob, not legacy encrypted transfers or backup
        copies. The HMAC digest is an identifier, not an authorization credential.
      security:
        - StorageAdminPassword: []
      parameters:
        - name: pinDigest
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9A-Fa-f]{64}$'
      responses:
        '204':
          description: Blob deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Missing or invalid admin password.
        '404':
          description: Blob not found or admin endpoints disabled.
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /health/live:
    get:
      operationId: liveness
      responses:
        '200':
          description: Process is running.
  /health/ready:
    get:
      operationId: readiness
      responses:
        '200':
          description: Database is reachable.
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  securitySchemes:
    StorageAdminPassword:
      type: http
      scheme: bearer
      description: Privately configured admin password. Not a revocation token; never log it.
  schemas:
    Pin:
      type: string
      pattern: '^[0123456789ABCDEFGHJKMNPQRSTVWXYZ]{6}$'
  responses:
    BadRequest:
      description: Request is invalid.
    RateLimited:
      description: Source rate limit exceeded; respect Retry-After.
      headers:
        Retry-After:
          schema:
            type: integer
            example: 60
    Unavailable:
      description: Storage is temporarily unavailable.
