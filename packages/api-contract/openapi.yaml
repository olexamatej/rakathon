openapi: 3.1.0
info:
  title: PillGaze Blob Storage API
  version: 0.2.0
  description: >-
    Store opaque JSON and retrieve its exact bytes using a six-character PIN.
    No expiry, consumption, revocation, or encryption enforcement. Synthetic data only.
    Responses use Cache-Control: no-store. Never log payloads or PINs.
paths:
  /v1/transfers:
    post:
      operationId: createTransfer
      summary: Store an opaque JSON blob
      requestBody:
        required: true
        content:
          application/json:
            schema: {}
      responses:
        '201':
          description: Stored; the response contains only the PIN.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [pin]
                properties:
                  pin:
                    $ref: '#/components/schemas/Pin'
        '400':
          description: Invalid JSON or missing application/json content type.
        '413':
          description: Request exceeds 1048576 bytes (1 MiB).
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/transfers/{pin}:
    get:
      operationId: getTransfer
      summary: Retrieve the original JSON blob without modifying or consuming it
      parameters:
        - name: pin
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Pin'
      responses:
        '200':
          description: Exact original request bytes, with application/json content type.
          content:
            application/json:
              schema: {}
        '404':
          description: Unknown or invalid PIN.
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /health/live:
    get:
      operationId: liveness
      responses:
        '200':
          description: Process is running.
  /health/ready:
    get:
      operationId: readiness
      responses:
        '200':
          description: Database is reachable.
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  schemas:
    Pin:
      type: string
      pattern: '^[0123456789ABCDEFGHJKMNPQRSTVWXYZ]{6}$'
  responses:
    RateLimited:
      description: Source rate limit exceeded; respect Retry-After.
      headers:
        Retry-After:
          schema:
            type: integer
            example: 60
    Unavailable:
      description: Storage is temporarily unavailable.
