worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    # Re-resolve after the Compose API container is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    server {
        listen 8080;
        absolute_redirect off;
        root /usr/share/nginx/html;
        client_max_body_size 384k;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        location = /ready { return 200 'ok'; }
        location = /release.json { add_header Cache-Control no-store; }
        location ~ /\. { return 404; }
        location ~ ^/storage-admin(?:/|$) {
            set $admin pillgaze-storage-admin:8080;
            proxy_pass http://$admin;
            proxy_set_header Host $host;
            proxy_buffering off;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-store" always;
        }
        location /api/ {
            set $api pillgaze-transfer-api:3000;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://$api;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For "";
            proxy_buffering off;
        }
        # Compatibility with the API's built-in encrypted browser demo.
        location ~ ^/(v1/|demo(?:/|$)|health/) {
            set $api pillgaze-transfer-api:3000;
            proxy_pass http://$api;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For "";
            proxy_buffering off;
        }
        location / { try_files $uri $uri/ /index.html; }
    }
}
