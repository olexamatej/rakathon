# Append to /home/rhodes/webserver/conf.d/site.conf before certificate issuance.
server {
    listen 80;
    listen [::]:80;
    server_name rakathon.denishromada.cz;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}
