# Append only after a valid certificate exists. Existing websites stay separate.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name rakathon.denishromada.cz;
    server_tokens off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /etc/letsencrypt/live/rakathon.denishromada.cz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rakathon.denishromada.cz/privkey.pem;
    client_max_body_size 384k;
    access_log off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    location / {
        proxy_pass http://172.20.0.1:30080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        # Do not trust client-supplied IP chains; current API limits are shared.
        proxy_set_header X-Forwarded-For "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_buffering off;
    }
}
