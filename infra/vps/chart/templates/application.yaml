apiVersion: v1
kind: ServiceAccount
metadata:
  name: rakathon
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rakathon-api
spec:
  replicas: 1
  # One SQLite writer and one retained local PVC. Upgrades briefly stop the API.
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: rakathon-api}
  template:
    metadata:
      labels: {app: rakathon-api}
      annotations:
        rakathon/revision: {{ .Values.revision | quote }}
    spec:
      nodeSelector: {kubernetes.io/arch: arm64}
      serviceAccountName: rakathon
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: {{ printf "%s:%s" .Values.apiImage .Values.release | quote }}
          imagePullPolicy: Never
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          ports: [{name: http, containerPort: 3000}]
          env:
            - {name: BIND_ADDRESS, value: "0.0.0.0:3000"}
            - {name: PILLGAZE_DB_PATH, value: "/data/transfers.sqlite3"}
            - {name: RUST_LOG, value: info}
            - name: CORS_ALLOWED_ORIGINS
              value: {{ printf "https://%s" .Values.hostname | quote }}
            - name: TRANSFER_HMAC_SECRET
              valueFrom:
                secretKeyRef: {name: rakathon-hmac, key: TRANSFER_HMAC_SECRET}
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 500m, memory: 256Mi}
          startupProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 15
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: rakathon-data}
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 16Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: rakathon-api
spec:
  selector: {app: rakathon-api}
  ports: [{name: http, port: 3000, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rakathon-web
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: rakathon-web}
  template:
    metadata:
      labels: {app: rakathon-web}
      annotations:
        rakathon/revision: {{ .Values.revision | quote }}
    spec:
      nodeSelector: {kubernetes.io/arch: arm64}
      serviceAccountName: rakathon
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: web
          image: {{ printf "%s:%s" .Values.webImage .Values.release | quote }}
          imagePullPolicy: Never
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          ports: [{name: http, containerPort: 8080}]
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 250m, memory: 96Mi}
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 15
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 32Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: rakathon-web
spec:
  type: NodePort
  selector: {app: rakathon-web}
  ports:
    - {name: http, port: 8080, targetPort: http, nodePort: {{ .Values.nodePort }}}
