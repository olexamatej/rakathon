{{- if .Values.ingress.enabled -}}
{{- $fullname := include "transfer-api.fullname" . -}}
{{- $fqdn := required "ingress.fqdn is required when ingress.enabled" .Values.ingress.fqdn -}}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.ingress.gatewayName }}
  labels:
    {{- include "transfer-api.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ .Values.ingress.gatewayClass }}
  listeners:
    - name: https
      hostname: {{ $fqdn }}
      port: 443
      protocol: HTTPS
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  # Rates, sizes and expiry are enforced by the API itself; the gateway
  # only terminates TLS. The OpenAPI contract remains authoritative.
  name: {{ $fullname }}
  labels:
    {{- include "transfer-api.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.ingress.gatewayName }}
  hostnames:
    - {{ $fqdn }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ $fullname }}
          port: {{ .Values.service.port }}
{{- end -}}
