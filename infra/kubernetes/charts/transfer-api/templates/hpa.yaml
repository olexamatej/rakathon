{{- if .Values.autoscaling.enabled -}}
# Horizontal scaling without the PostgreSQL adapter would split SQLite
# state across replicas. Allowed by an explicit operator decision only;
# document it in the HelmRelease or values used for each environment.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "transfer-api.fullname" . }}
  labels:
    {{- include "transfer-api.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "transfer-api.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
{{- end -}}
