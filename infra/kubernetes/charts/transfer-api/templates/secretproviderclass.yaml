{{- if .Values.secretProvider.enabled }}
{{- if .Values.secretProvider.azure.workloadIdentity.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "transfer-api.fullname" . }}-hmac
  labels:
    {{- include "transfer-api.labels" . | nindent 4 }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: {{ required "secretProvider.azure.workloadIdentity.clientId is required" .Values.secretProvider.azure.workloadIdentity.clientId | quote }}
    keyvaultName: {{ required "secretProvider.azure.vaultName is required" .Values.secretProvider.azure.vaultName | quote }}
    cloudName: "AzurePublicCloud"
    objects: |
      array:
        - |
          objectName: {{ .Values.secretProvider.azure.secretName }}
          objectAlias: TRANSFER_HMAC_SECRET
          objectType: secret
          objectVersion: ""
  # Materialize Azure Key Vault content as a namespaced Kubernetes Secret
  # so the container only needs a standard secretKeyRef; the CSI controller
  # keeps it rotated.
  secretObjects:
    - secretName: {{ .Values.secretRef.name }}
      type: Opaque
      data:
        - objectName: {{ .Values.secretProvider.azure.secretName }}
          key: TRANSFER_HMAC_SECRET
{{- end }}
{{- end }}
