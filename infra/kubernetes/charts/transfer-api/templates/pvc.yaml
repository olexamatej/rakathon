apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "transfer-api.pvcName" . }}
  labels:
    {{- include "transfer-api.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.database.sqlite.persistentVolume.storageClass }}
  storageClassName: {{ .Values.database.sqlite.persistentVolume.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.database.sqlite.persistentVolume.size }}
