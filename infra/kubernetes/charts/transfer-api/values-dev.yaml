# Development overlay for the pillgaze-dev AKS cluster.
# Values here reflect the Bicep deployment created from `infra/azure/`.
# Keep secret values out: the HMAC secret lives in Azure Key Vault and is
# materialized by the CSI driver.

image:
  # ACR name is decided during provisioning (see infra/azure/parameters).
  repository: SET_BY_PROVISIONING.azurecr.io/transfer-api

secretProvider:
  enabled: true
  azure:
    vaultName: SET_BY_PROVISIONING-kv
    secretName: transfer-hmac-secret
    workloadIdentity:
      enabled: true
      clientId: SET_BY_PROVISIONING

secretRef:
  name: transfer-api-hmac

config:
  corsAllowedOrigins:
    - https://thankful-desert-037dff40f.4.azurestaticapps.net
    - http://localhost:8081
    - http://localhost:5173
    - http://127.0.0.1:8081
    - http://127.0.0.1:5173

networkPolicy:
  egress:
    postgres:
      enabled: false

ingress:
  enabled: false
