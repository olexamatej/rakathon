# Defaults for the PillGaze transfer API Helm chart.
# Every value here must remain true to security defaults:
# no secret literals, non-root container, read-only filesystem,
# no capabilities, bounded resources.

replicaCount: 1

image:
  repository: pillgazelacr.azurecr.io/transfer-api
  # Empty tag means use the digest pinned by the Flux HelmRelease instead.
  tag: ""
  pullPolicy: IfNotPresent
  # Add registry credentials if ACR becomes private-only or ingress
  # requires imagePullSecrets in a public cluster.
  imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

# Transfer API configuration.
config:
  # 0.0.0.0 inside the container so kube-proxy / Service wiring reaches it.
  bindAddress: "0.0.0.0:3000"
  # Comma-separated list; the API enforces CORS on every most-sensitive
  # endpoint. Read the OpenAPI contract before adding an origin here.
  corsAllowedOrigins:
    - http://localhost:8081
    - http://localhost:5173
    - http://127.0.0.1:8081
    - http://127.0.0.1:5173
  logLevel: info

secretRef:
  # The chart NEVER holds the HMAC secret value itself.
  # Provide a Kubernetes Secret holding TRANSFER_HMAC_SECRET (at least
  # 32 bytes) or enable secretProvider below to materialize it from
  # Azure Key Vault with the CSI driver.
  name: transfer-api-hmac

# Azure Key Vault CSI SecretProviderClass materialization.
secretProvider:
  enabled: false
  azure:
    # Name of the Key Vault deployed by `infra/azure/` (not the URI).
    vaultName: ""
    # Key Vault secret that contains TRANSFER_HMAC_SECRET.
    secretName: transfer-hmac-secret
    # Optional identity binding (Workload ID) when enabled on AKS.
    # Disabled here until `workloadIdentity` is configured on the cluster.
    workloadIdentity:
      enabled: false
      clientId: ""

database:
  # Only SQLite storage is implemented in the Rust API today. When the
  # PostgreSQL adapter lands, switch `mode` to `postgres` and supply a
  # DATABASE_URL from a secret in the same `secretRef.name`.
  mode: sqlite
  sqlite:
    path: /data/transfers.sqlite3
    # Existing PVC with `ReadWriteOnce`. Created by this chart only when
    # persistentVolume.create is true.
    persistentVolume:
      create: true
      name: ""
      size: 1Gi
      storageClass: ""
      existingClaim: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

ingress:
  # Gateway API (Application Gateway for Containers) resources.
  enabled: false
  gatewayName: transfer-api-gateway
  gatewayClass: azure-alb-external-controller
  fqdn: ""
  # Aggregated limits are enforced in the API; the gateway only terminates TLS.
  corsAllowedOrigins: []

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70

resources:
  requests:
    memory: 64Mi
    cpu: 50m
  limits:
    memory: 256Mi
    cpu: 500m

nodeSelector: {}
tolerations: []
affinity: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  privileged: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL

# Liveness/readiness probes hit the API HTTP endpoints. Both endpoints
# are documented in packages/api-contract/openapi.yaml.
probes:
  liveness:
    path: /health/live
    port: 3000
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    path: /health/ready
    port: 3000
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

networkPolicy:
  enabled: true
  # Restrict ingress to the ingress gateway namespace when present.
  ingressNamespaceLabels: {}
  egress:
    # Kube DNS.
    dns:
      enabled: true
      namespace: kube-system
      labels:
        k8s-app: kube-dns
    # Outbound to PostgreSQL Flexible Server once its adapter is wired in.
    postgres:
      enabled: false
      port: 5432
      ipBlock: ""

podLabels: {}
podAnnotations: {}
