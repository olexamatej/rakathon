---
# Flux reconciles the transfer-api Helm chart from this repository.
# The Flux-managed GitRepository `flux-system/flux-system` (bootstrap
# target) points to olexamatej/rakathon; its credentials are supplied
# by `flux bootstrap` and never versioned here.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: transfer-api
  namespace: flux-system
spec:
  interval: 5m
  targetNamespace: pillgaze-dev
  timeout: 10m
  releaseName: transfer-api
  chart:
    spec:
      chart: transfer-api
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      path: infra/kubernetes/charts/transfer-api
  install:
    createNamespace: false
    remediation:
      retries: 2
  upgrade:
    remediation:
      retries: 2
  valuesFrom:
    - kind: ConfigMap
      name: transfer-api-dev-values
      optional: false
  values:
    # Tag is written by CI (see .github/workflows/container-deploy.yml);
    # keeping it inline means kustomize setters find it deterministically.
    # {"$imagepolicy": "flux-system:transfer-api:tag"}
    image:
      tag: 0.0.0
---
# Environment overlay for the dev cluster; provision.sh replaces the
# SET_BY_PROVISIONING markers with actual Bicep outputs exactly once.
# No secret literals belong here: the HMAC secret materializes via
# Azure Key Vault CSI into secret "transfer-api-hmac" in pillgaze-dev.
apiVersion: v1
kind: ConfigMap
metadata:
  name: transfer-api-dev-values
  namespace: flux-system
data:
  values.yaml: |
    image:
      repository: SET_BY_PROVISIONING
    secretProvider:
      enabled: true
      azure:
        vaultName: SET_BY_PROVISIONING
        secretName: transfer-hmac-secret
        workloadIdentity:
          enabled: true
          clientId: SET_BY_PROVISIONING
    config:
      corsAllowedOrigins:
        - https://thankful-desert-037dff40f.4.azurestaticapps.net
        - http://localhost:8081
        - http://localhost:5173
        - http://127.0.0.1:8081
        - http://127.0.0.1:5173
    ingress:
      enabled: false
