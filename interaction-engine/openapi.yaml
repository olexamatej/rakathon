openapi: 3.1.0
info:
  title: Drug Interaction API
  version: 0.1.0
  description: |
    Resolves drug names and checks unique unordered pairs for known interactions.
    Only pairs with known interactions are returned. A missing pair means no
    interaction was found in the available knowledge sources, not proof of safety.
    This contract does not assess interactions requiring three or more drugs,
    or patient-specific factors such as dose, route, age, or medical conditions.
    No authentication is required by this initial contract.
    The /interaction-checks endpoint uses model knowledge without web search or
    retrieval from a curated interaction database. Clinical findings and evidence
    labels are unverified; source references are empty. Coverage reports pairs
    considered by the model rather than a verified database search.
    Human-readable response explanations are always in Czech (cs), including
    summaries, mechanisms, clinical effects, recommendation descriptions,
    resolution issue messages, and problem titles/details/validation messages.
    JSON property names and enum values remain as defined. Drug and ingredient
    names retain their identity. Input names are echoed
    exactly as submitted. Accept-Language does not change the output language.
servers:
  - url: /
    description: Relative to the deployment host; no hosted service is specified yet.
security: []
tags:
  - name: Interactions
    description: Pairwise checks for a submitted list of drug names.
paths:
  /interaction-checks:
    post:
      operationId: checkDrugInteractions
      tags: [Interactions]
      summary: Submit or poll a pairwise interaction check
      description: |
        Submit and poll by repeating the same POST body. New work returns 202
        with state queued; duplicate pending requests return 202 with state queued
        or running and do not start another execution. Completed results return
        200 unchanged. Exact drug strings and order determine request identity.
        Successful results are retained for RESULT_TTL_SECONDS (default 86400);
        failures return a stored 503 for FAILURE_TTL_SECONDS (default 30).
        After expiry, the next identical POST starts fresh work. Poll every two
        seconds while 202 is returned, backing off to five seconds if needed.
        No public job IDs or separate polling URLs are used.

        Accepts generic or brand names. Names must be nonblank after trimming.
        Names that cannot be resolved uniquely are reported alongside results;
        the service must not silently choose a candidate for an ambiguous name.

        Each input has a resolution entry at its zero-based input index. Inputs
        resolving to the same drug share a response-local drug ID and are checked
        only once. There are no self-pairs. A-B and B-A are the same pair.
        A combination product is one resolved drug with its active ingredients
        listed; ingredient-level evidence is aggregated under the submitted
        product pair. Interactions within a single product are outside scope.

        For m distinct resolved drugs, all m*(m-1)/2 pairs are evaluated. The
        interactions array contains at most one record per unordered pair, with
        one or more findings. It contains no records for pairs without known
        interactions. Interaction and finding order has no semantic meaning.

        Unknown, ambiguous, or unsupported names do not fail the request. HTTP
        200 is returned even if fewer than two distinct drugs resolve, in which
        case there are no evaluated pairs and interactions is empty. A partial
        response means at least one input could not be resolved. Service failures
        preventing evaluation of resolved pairs return 503 instead of silently
        presenting incomplete coverage as a completed check.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InteractionCheckRequest'
            example:
              drugs: [warfarin, ibuprofen, unknown-drug-name]
      responses:
        '202':
          description: Work accepted or still in progress. Repeat the same POST to poll.
          headers:
            Retry-After:
              description: Suggested polling delay in seconds.
              schema: {type: integer, const: 2}
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingResponse'
        '200':
          description: |
            Check completed for all distinct resolved drugs. Inspect status,
            resolutions, and coverage to determine which inputs were assessed.
          headers:
            Content-Language:
              description: Language of human-readable explanations, fixed to Czech.
              schema:
                type: string
                const: cs
            X-Interaction-Source:
              description: Origin of the interaction findings in this implementation.
              schema:
                type: string
                const: model-knowledge
            X-Sources-Verified:
              description: Whether clinical claims were verified against retrieved sources.
              schema:
                type: string
                const: 'false'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InteractionCheckResponse'
              examples:
                partial:
                  summary: Illustrative result with an unrecognized input
                  description: Clinical wording is illustrative, not a curated drug record.
                  value:
                    status: partial
                    checkedAt: '2026-10-16T12:00:00Z'
                    resolutions:
                      - inputIndex: 0
                        inputName: warfarin
                        status: resolved
                        drugId: drug-1
                      - inputIndex: 1
                        inputName: ibuprofen
                        status: resolved
                        drugId: drug-2
                      - inputIndex: 2
                        inputName: unknown-drug-name
                        status: unrecognized
                        message: Nebylo nalezeno odpovídající léčivo.
                        candidates: []
                    drugs:
                      - id: drug-1
                        name: warfarin
                        activeIngredients: [warfarin]
                      - id: drug-2
                        name: ibuprofen
                        activeIngredients: [ibuprofen]
                    coverage:
                      uniqueResolvedDrugs: 2
                      evaluatedPairs: 1
                      interactingPairs: 1
                    interactions:
                      - drugIds: [drug-1, drug-2]
                        severity: major
                        findings:
                          - summary: Možné zvýšení rizika krvácení.
                            severity: major
                            clinicalEffects: [Zvýšené riziko krvácení]
                            recommendations:
                              - action: use_alternative
                                description: Vhodnost této kombinace konzultujte s lékařem.
                            evidence:
                              level: unknown
                              references: []
                noKnownInteractions:
                  summary: Empty results still report evaluation coverage
                  value:
                    status: complete
                    checkedAt: '2026-10-16T12:00:00Z'
                    resolutions:
                      - inputIndex: 0
                        inputName: Example drug A
                        status: resolved
                        drugId: drug-1
                      - inputIndex: 1
                        inputName: Example drug B
                        status: resolved
                        drugId: drug-2
                    drugs:
                      - id: drug-1
                        name: Example drug A
                        activeIngredients: [Example ingredient A]
                      - id: drug-2
                        name: Example drug B
                        activeIngredients: [Example ingredient B]
                    coverage:
                      uniqueResolvedDrugs: 2
                      evaluatedPairs: 1
                      interactingPairs: 0
                    interactions: []
        '400':
          description: Malformed JSON or a request violating the input schema.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          description: Request body exceeds the server's byte-size limit.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: Content-Type must be application/json.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Shared pending-work queue is full; existing requests can still be polled.
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
                minimum: 0
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Drug resolution or interaction evaluation is temporarily unavailable.
          headers:
            Retry-After:
              description: Seconds to wait before retrying, when known.
              schema:
                type: integer
                minimum: 0
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: Unexpected server error.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /interaction-research:
    post:
      operationId: researchDrugInteraction
      tags: [Interactions]
      summary: Submit or poll research on a supported external site
      description: |
        Submit and poll by repeating the same POST body. New or pending work
        returns 202 with state queued or running; duplicates share one execution.
        Completed results return 200 unchanged. Results are retained for 86400
        seconds and failures return a stored 503 for 30 seconds by default,
        configurable via RESULT_TTL_SECONDS and FAILURE_TTL_SECONDS. Poll every
        two seconds while 202 is returned. Exact drug strings and order determine
        identity; equivalent supported site URLs/domains use the canonical domain.
        After expiry, the next identical POST starts fresh work.
        Uses the Medscape checker JSON APIs directly for reference.medscape.com;
        other sites use a fresh agent with live web search restricted to the site. Accepts precisely two drug names and either a canonical domain or
        the exact checker URL from the site enum. Returned site is canonical.
        found means explicit evidence for the pair was found in a dedicated pair
        page, monograph, interaction article, sufficiently explicit live search
        snippet, or validated Medscape pair API response, even if the source reports
        no known interaction. Snippet-only evidence is labeled in the summary for
        physician verification. Generic checkers, homepages, mere co-mentions and
        class warnings alone do not qualify. not_found means the search found no
        qualifying pair evidence, not proof of safety. inconclusive means ambiguous
        names or insufficient accessible evidence prevented a reliable result.
        The agent tries generic/brand equivalents and monograph/article searches
        before returning no match. The summary is in Czech and limited to 1–3 short
        sentences. Clinical claims must come from the source. Medscape requires exact name
        matches, validates returned pair names, and uses a tool-free model only
        for Czech summarization. Its URL identifies the pair-specific JSON API
        request; access failures or unresolved names return inconclusive.
        Findings are source-based,
        not independently medically verified. Service/model failures and timeouts
        return a retained 503. Shares CODEX_TIMEOUT_SECONDS and MAX_CONCURRENT_CHECKS with
        interaction checks (defaults: 90 seconds, 4 concurrent processes).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InteractionResearchRequest'
            example:
              drugs: [warfarin, ibuprofen]
              site: drugs.com
      responses:
        '202':
          description: Work accepted or still in progress. Repeat the same POST to poll.
          headers:
            Retry-After:
              description: Suggested polling delay in seconds.
              schema: {type: integer, const: 2}
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingResponse'
        '200':
          description: Research completed, including negative or inconclusive outcomes.
          headers:
            Content-Language:
              schema: {type: string, const: cs}
            X-Interaction-Source:
              schema: {type: string, enum: [web-search, medscape-api]}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InteractionResearchResponse'
        '400':
          description: Invalid drug pair or unsupported site.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          description: Body exceeds 64 KiB.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: Content-Type must be application/json.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Shared pending-work queue is full; existing requests can still be polled.
          headers:
            Retry-After:
              schema: {type: integer, minimum: 0}
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Agent failed, timed out, or returned an invalid result.
          headers:
            Retry-After:
              schema: {type: integer, minimum: 0}
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: Unexpected server error.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  schemas:
    PendingResponse:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state:
          type: string
          enum: [queued, running]
    ResearchDrugs:
      type: array
      minItems: 2
      maxItems: 2
      items:
        type: string
        minLength: 1
        maxLength: 200
        pattern: '\S'
    ResearchSite:
      type: string
      enum: [drugs.com, webmd.com, patient.info, rxlist.com, reference.medscape.com, rxlabelguard.com, rxcheck.dev]
    InteractionResearchRequest:
      type: object
      additionalProperties: false
      required: [drugs, site]
      properties:
        drugs:
          $ref: '#/components/schemas/ResearchDrugs'
        site:
          oneOf:
            - $ref: '#/components/schemas/ResearchSite'
            - type: string
              enum:
                - https://www.drugs.com/drug_interactions.html
                - https://www.webmd.com/interaction-checker/default.htm
                - https://patient.info/treatment-medication/interaction-checker
                - https://www.rxlist.com/drug-interaction-checker.htm
                - https://reference.medscape.com/drug-interactionchecker
                - https://rxlabelguard.com/
                - https://rxcheck.dev/
    InteractionResearchResponse:
      type: object
      additionalProperties: false
      required: [drugs, site, checkedAt, status, url, summary]
      properties:
        drugs:
          $ref: '#/components/schemas/ResearchDrugs'
        site:
          $ref: '#/components/schemas/ResearchSite'
        checkedAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [found, not_found, inconclusive]
        url:
          type: [string, 'null']
          format: uri
          maxLength: 4096
          description: Actual HTTPS evidence source URL (including a source identified by a live search snippet), Medscape pair-specific JSON API URL, or null.
        summary:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: '\S'
          description: Short Czech source-based summary, or reason no result is available.
      allOf:
        - if:
            properties:
              status: {const: found}
          then:
            properties:
              url: {type: string, pattern: '^https://'}
          else:
            properties:
              url: {type: 'null'}
    InteractionCheckRequest:
      type: object
      additionalProperties: false
      required: [drugs]
      properties:
        drugs:
          type: array
          minItems: 2
          maxItems: 50
          description: |
            Generic or brand names, including combination product names.
            Duplicate names are allowed and deduplicated after resolution.
            Name support depends on the underlying drug catalog; the service
            does not infer a country or silently resolve regional ambiguity.
          items:
            type: string
            minLength: 1
            maxLength: 200
            pattern: '\S'
    InteractionCheckResponse:
      type: object
      required: [status, checkedAt, resolutions, drugs, coverage, interactions]
      properties:
        status:
          type: string
          enum: [complete, partial]
          description: |
            complete means every input resolved; partial means at least one did
            not. Neither value asserts completeness of medical knowledge.
        checkedAt:
          type: string
          format: date-time
          description: Time of the check, not the last update of its knowledge sources.
        resolutions:
          type: array
          minItems: 2
          maxItems: 50
          description: One entry per input, in the original input order.
          items:
            $ref: '#/components/schemas/DrugResolution'
        drugs:
          type: array
          maxItems: 50
          description: Distinct resolved drugs, ordered by first appearance in the input.
          items:
            $ref: '#/components/schemas/ResolvedDrug'
        coverage:
          $ref: '#/components/schemas/Coverage'
        interactions:
          type: array
          maxItems: 1225
          description: Only known interacting unordered pairs; no duplicate or self-pairs.
          items:
            $ref: '#/components/schemas/PairInteraction'
    DrugResolution:
      oneOf:
        - $ref: '#/components/schemas/SuccessfulResolution'
        - $ref: '#/components/schemas/ResolutionIssue'
      discriminator:
        propertyName: status
        mapping:
          resolved: '#/components/schemas/SuccessfulResolution'
          unrecognized: '#/components/schemas/ResolutionIssue'
          ambiguous: '#/components/schemas/ResolutionIssue'
          unsupported: '#/components/schemas/ResolutionIssue'
    SuccessfulResolution:
      type: object
      required: [inputIndex, inputName, status, drugId]
      properties:
        inputIndex:
          $ref: '#/components/schemas/InputIndex'
        inputName:
          type: string
          description: Exact name as submitted, before trimming or normalization.
        status:
          const: resolved
          type: string
        drugId:
          type: string
          minLength: 1
          description: References an entry in the response drugs array.
    ResolutionIssue:
      type: object
      required: [inputIndex, inputName, status, message, candidates]
      properties:
        inputIndex:
          $ref: '#/components/schemas/InputIndex'
        inputName:
          type: string
          description: Exact name as submitted.
        status:
          type: string
          enum: [unrecognized, ambiguous, unsupported]
          description: |
            unrecognized means no match; ambiguous means multiple possible
            matches; unsupported means identified but unavailable for checking.
        message:
          type: string
          minLength: 1
        candidates:
          type: array
          description: |
            Possible names for client-assisted correction, never automatically
            assessed. Empty when no suggestions are available. Resubmitting a
            candidate name does not guarantee that ambiguity will be resolved.
          items:
            type: string
            minLength: 1
    InputIndex:
      type: integer
      minimum: 0
      maximum: 49
    ResolvedDrug:
      type: object
      required: [id, name, activeIngredients]
      properties:
        id:
          type: string
          minLength: 1
          description: Unique within this response; not a persistent drug identifier.
        name:
          type: string
          minLength: 1
          description: Canonical name selected by name resolution.
        activeIngredients:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            minLength: 1
    Coverage:
      type: object
      required: [uniqueResolvedDrugs, evaluatedPairs, interactingPairs]
      properties:
        uniqueResolvedDrugs:
          type: integer
          minimum: 0
          maximum: 50
          description: m, equal to the length of drugs.
        evaluatedPairs:
          type: integer
          minimum: 0
          maximum: 1225
          description: Always m*(m-1)/2, including pairs with no known interaction.
        interactingPairs:
          type: integer
          minimum: 0
          maximum: 1225
          description: Equal to the length of interactions; never exceeds evaluatedPairs.
    PairInteraction:
      type: object
      required: [drugIds, severity, findings]
      properties:
        drugIds:
          type: array
          minItems: 2
          maxItems: 2
          uniqueItems: true
          description: |
            Exactly two distinct IDs from drugs. Order has no clinical meaning;
            IDs are emitted in their order of appearance in the drugs array.
          items:
            type: string
            minLength: 1
        severity:
          $ref: '#/components/schemas/Severity'
          description: |
            Highest known severity among findings, ordered contraindicated,
            major, moderate, minor. unknown is used only if every finding has
            unknown severity; inspect findings for unclassified effects.
        findings:
          type: array
          minItems: 1
          description: Distinct effects or mechanisms for this pair, with supporting evidence.
          items:
            $ref: '#/components/schemas/InteractionFinding'
    Severity:
      type: string
      enum: [contraindicated, major, moderate, minor, unknown]
      description: |
        API classification, normalized from source data. contraindicated means
        a source explicitly classifies concurrent use as contraindicated; major
        means a potentially serious effect; moderate means a clinically relevant
        effect that may require management; minor means a limited clinical
        effect; unknown means severity has not been classified. Unknown does not
        mean low risk. Source classifications may differ.
    InteractionFinding:
      type: object
      required: [summary, severity, clinicalEffects, recommendations, evidence]
      properties:
        summary:
          type: string
          minLength: 1
        severity:
          $ref: '#/components/schemas/Severity'
        mechanism:
          type: string
          minLength: 1
          description: Known mechanism, omitted when unavailable.
        clinicalEffects:
          type: array
          description: Potential clinical effects; empty if unavailable.
          items:
            type: string
            minLength: 1
        recommendations:
          type: array
          description: Source-supported management guidance; empty if unavailable.
          items:
            $ref: '#/components/schemas/Recommendation'
        evidence:
          $ref: '#/components/schemas/Evidence'
    Recommendation:
      type: object
      required: [action, description]
      properties:
        action:
          type: string
          enum: [avoid_combination, use_alternative, monitor, adjust_dose, separate_administration, no_action, consult_clinician, other]
        description:
          type: string
          minLength: 1
          description: Explanation including any source-supported conditions or qualifications.
    Evidence:
      type: object
      required: [level, references]
      properties:
        level:
          type: string
          enum: [established, limited, theoretical, unknown]
          description: |
            established means consistent clinical support; limited means sparse
            or inconsistent clinical support; theoretical means a predicted
            interaction without direct clinical support; unknown means evidence
            strength was not classified. Evidence strength is separate from severity.
        references:
          type: array
          description: |
            Sources supporting this finding. Empty when no citable reference
            is available.
          items:
            $ref: '#/components/schemas/Reference'
    Reference:
      type: object
      required: [title, url]
      properties:
        title:
          type: string
          minLength: 1
        url:
          type: string
          format: uri
          pattern: '^https?://'
        publisher:
          type: string
          minLength: 1
        sourceSeverity:
          type: string
          minLength: 1
          description: Original severity label used by this source, when available.
        updatedAt:
          type: string
          format: date-time
          description: Source update time, when supplied by the source.
    Problem:
      type: object
      description: RFC 9457 problem details. HTTP status and status must agree.
      required: [type, title, status, detail]
      properties:
        type:
          type: string
          format: uri
          default: about:blank
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        code:
          type: string
          enum: [execution_failed, worker_interrupted, queue_timeout]
          description: Machine-readable code for retained background-work failures.
        instance:
          type: string
          format: uri-reference
        errors:
          type: array
          description: Optional field-level validation errors.
          items:
            type: object
            required: [pointer, message]
            properties:
              pointer:
                type: string
                description: JSON Pointer to the invalid request value, e.g. /drugs/0.
              message:
                type: string
